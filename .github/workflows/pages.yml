# Publie automatiquement le jeu (dossier prototype/) sur GitHub Pages à chaque envoi sur main.
# Les documents de conception (docs/) ne sont pas publiés.
name: Publier le jeu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Données de la carte 3D de la ville (OpenStreetMap + relief), générées une seule fois puis gardées en cache.
      # Elles sont régénérées si le script outils/carte_ville.py change.
      - uses: actions/cache@v4
        with:
          path: prototype/carte/ville.json
          key: ville-${{ hashFiles('outils/carte_ville.py') }}
      - name: Générer la carte de la ville
        if: hashFiles('prototype/carte/ville.json') == ''
        continue-on-error: true
        timeout-minutes: 40
        run: |
          pip install --quiet pillow
          python3 outils/carte_ville.py prototype/carte/ville.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - id: deploiement
        uses: actions/deploy-pages@v4
