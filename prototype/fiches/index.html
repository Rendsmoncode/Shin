<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fiches des personnages</title>
<style>
/* Fiches des personnages : liste à gauche, fiche à droite, modifiable. Même aspect sombre que la page de jeu. */
:root{--bg:#141a16;--bar:#10150f;--card:#1b231e;--card2:#212b25;--line:#33443a;--fg:#e7e3d6;--muted:#a3ab9f;--gold:#e3b54a;--red:#d0604f;--ok:#7fb069;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-size:17px}
body{display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:5px 11px;font-weight:600;letter-spacing:.02em}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.or{background:var(--gold);color:#1a1405;border-color:var(--gold)}
button.danger{color:var(--red)}
.haut{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.haut h1{margin:0 8px 0 0;font-size:21px;letter-spacing:.06em;color:var(--gold)}
.haut .info{color:var(--muted);font-size:15px}
.haut .droite{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.corps{display:grid;grid-template-columns:270px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px}
aside input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:6px 9px;margin-bottom:8px}
aside button.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;padding:6px 8px;font-weight:500}
aside button.item:hover{background:var(--card)}
aside button.item[aria-current="true"]{background:var(--card);border-color:var(--line)}
.pastille{width:10px;height:10px;border-radius:50%;flex:none}
.modif{margin-left:auto;font-size:12px;color:var(--gold)}
.choix{display:none;padding:8px 12px;border-bottom:1px solid var(--line)}
.choix select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:6px}
main{overflow:auto;padding:16px}
.fiche{max-width:900px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bandeau{padding:7px 16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:15px;color:#140f05;display:flex;align-items:center;gap:10px}
.bandeau .etoiles{letter-spacing:2px}
.bandeau .actions{margin-left:auto;display:flex;gap:6px}
.bandeau .actions button{background:rgba(0,0,0,.25);color:#fff;border-color:rgba(0,0,0,.3);padding:3px 9px;font-size:15px}
.tete{display:grid;grid-template-columns:auto 1fr;gap:18px;padding:16px}
.portrait{width:230px;aspect-ratio:3/4;border-radius:8px;border:2px solid var(--line);background:linear-gradient(160deg,#2a362f,#121813);display:grid;place-items:center;overflow:hidden;position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .initiales{font-size:72px;font-weight:700;color:rgba(231,227,214,.18);letter-spacing:.05em}
.portrait .sansimage{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
.ident h2{margin:0;font-size:36px;letter-spacing:.03em;line-height:1.05}
.ident .surnom{color:var(--gold);font-size:21px;font-style:italic;margin:2px 0 10px}
.ident dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 12px}
.ident dt{color:var(--muted)}
.ident dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.stat{display:grid;grid-template-columns:44px 52px 1fr;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.stat b{color:var(--muted);font-weight:600}
.stat .barre{height:9px;border-radius:5px;background:#0f1411;overflow:hidden;border:1px solid var(--line)}
.stat .barre i{display:block;height:100%;background:linear-gradient(90deg,#8c6b22,var(--gold))}
.stat .barre i.exces{background:linear-gradient(90deg,#3d8a8c,#7ee0d6)}
.statsnote{grid-column:1/-1;color:var(--muted);font-size:14px}
section.bloc{border-top:1px solid var(--line);padding:12px 16px}
section.bloc h4{margin:0 0 8px;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
section.bloc p{margin:0;line-height:1.4}
.liste{display:grid;gap:8px}
.ligne b{color:var(--fg)}
.ligne .quand{display:inline-block;color:var(--muted);font-size:14px;margin-left:6px}
.ligne .type{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px;color:var(--muted)}
table{width:100%;border-collapse:collapse}
td{border-top:1px solid var(--line);padding:6px 8px;vertical-align:top;line-height:1.4}
td:first-child{white-space:nowrap;color:var(--gold);font-weight:600;width:1%}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{border:1px solid var(--line);background:var(--card2);border-radius:20px;padding:2px 10px;font-size:15px}
.vide{color:var(--muted);font-style:italic}
.note{color:var(--gold)}
/* formulaire */
.form{display:grid;gap:10px;padding:16px}
.form label{display:grid;gap:3px;color:var(--muted);font-size:15px}
.form input,.form textarea,.form select{background:#0f1411;border:1px solid var(--line);border-radius:5px;padding:6px 8px;color:var(--fg);font-size:16px}
.form textarea{min-height:60px;resize:vertical;line-height:1.35}
.form .deux{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .six{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.form fieldset{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:8px}
.form legend{color:var(--gold);padding:0 6px;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.form .rangee{display:grid;gap:6px;border:1px dashed var(--line);border-radius:5px;padding:8px}
.form .rangee .entete{display:flex;gap:6px;align-items:center}
.form .rangee .entete input{flex:1}
.form .boutons{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* histoire */
dialog{max-width:760px;width:calc(100% - 32px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
dialog .h h3{margin:0;color:var(--gold);letter-spacing:.05em}
dialog .h button{margin-left:auto}
dialog .c{padding:14px;max-height:65vh;overflow:auto;line-height:1.5;white-space:pre-wrap}
dialog textarea{width:100%;min-height:45vh;background:#0f1411;border:1px solid var(--line);border-radius:5px;padding:8px;color:var(--fg);line-height:1.45}
.apercu{max-width:900px;margin:0 auto 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.apercu button{padding:3px 9px;font-size:15px}
.apercu button[aria-pressed="true"]{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.apercu label{margin-left:8px;display:flex;align-items:center;gap:5px;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:8px 14px;border-radius:6px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){
  .corps{grid-template-columns:1fr}
  aside{display:none}
  .choix{display:block}
  .tete{grid-template-columns:1fr}
  .portrait{width:min(230px,100%);margin:0 auto}
  .stats{grid-template-columns:1fr}
  .form .deux,.form .six{grid-template-columns:1fr 1fr}
  main{padding:10px}
}
</style>
</head>
<body>
<header class="haut">
  <h1>FICHES</h1>
  <span class="info" id="info">Chargement…</span>
  <div class="droite">
    <button type="button" id="nouvelle">+ Nouvelle fiche</button>
    <button type="button" class="or" id="exporter" title="Copie tes modifications pour les envoyer à Claude">Exporter mes modifications</button>
    <button type="button" class="danger" id="effacer" title="Une fois tes modifications intégrées par Claude">Effacer mes modifications</button>
  </div>
</header>
<div class="choix"><select id="choixMobile" aria-label="Choisir une fiche"></select></div>
<div class="corps">
  <aside aria-label="Liste des fiches">
    <input type="search" id="recherche" placeholder="Rechercher…" aria-label="Rechercher une fiche">
    <div id="liste"></div>
  </aside>
  <main id="zone"></main>
</div>
<dialog id="histoire" aria-labelledby="histoireTitre">
  <div class="h"><h3 id="histoireTitre">📜 Histoire</h3><button type="button" id="histoireFermer">Fermer</button></div>
  <div class="c" id="histoireCorps"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script>
// Données : fiches.json (version de base, tenue par Claude). Les modifications faites ici sont gardées
// dans ce navigateur (localStorage) ; « Exporter » les copie pour les envoyer à Claude, qui les intègre au fichier.
// Shin, Koby et Guts évoluent (« paliers ») : la fiche ne montre que ce qui est débloqué à la rareté choisie dans l'aperçu.
// Un objet (ex. le guandao d'Ouki) n'apparaît que s'il est marqué comme obtenu dans l'aperçu.
const CLE='shin-fiches-modifs';
const STATS=['ATK','DEF','END','INT','VIT','Aura'];
const ORDRE=['caché','mystique','cieux','légend','épique','rare','commun'];
let base=[],modifs={},courant=null,edition=false;
const etape={},objetObtenu={};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const copie=o=>JSON.parse(JSON.stringify(o));
function lireModifs(){try{return JSON.parse(localStorage.getItem(CLE)||'{}')||{};}catch(e){return{};}}
function ecrireModifs(){try{localStorage.setItem(CLE,JSON.stringify(modifs));return true;}catch(e){toast('Impossible d\'enregistrer dans ce navigateur');return false;}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200);}

function toutes(){
  const m=new Map(base.map(f=>[f.id,f]));
  for(const [id,f] of Object.entries(modifs))if(f)m.set(id,f);
  return [...m.values()];
}
const fiche=id=>toutes().find(f=>f.id===id);
const estModifiee=id=>!!modifs[id];
const estNouvelle=id=>!base.some(f=>f.id===id);
const evolue=f=>Array.isArray(f.paliers)&&f.paliers.length>0;
const idxEtape=f=>Math.min(etape[f.id]??0,f.paliers.length-1);

// ce que montre la fiche : pour un personnage qui évolue, tout ce qui est débloqué jusqu'à la rareté choisie
function vue(f){
  if(!evolue(f))return f;
  const n=idxEtape(f),v=copie(f);v.passifs=[];v.attaques=[];v.formations=[];v.strategies=[];v.leader='';
  f.paliers.slice(0,n+1).forEach(p=>{if(p.leader)v.leader=p.leader;v.passifs.push(...(p.passifs||[]));v.attaques.push(...(p.attaques||[]));v.formations.push(...(p.formations||[]));v.strategies.push(...(p.strategies||[]));});
  v.rarete=f.paliers[n].rarete;v.stats=f.paliers[n].stats||{};
  return v;
}

function couleur(r){
  r=(r||'').toLowerCase();
  if(r.includes('caché'))return['#1c1a14','#e3b54a','★★★★★★'];
  if(r.includes('mystique'))return['#3d8a8c','#bff3ec','✦✦✦✦✦'];
  if(r.includes('cieux'))return['#b0473a','#ffd38a','★★★★★'];
  if(r.includes('légend'))return['#c99a2e','#2a1d04','★★★★'];
  if(r.includes('épique'))return['#7b4fa8','#f0e6ff','★★★'];
  if(r.includes('rare'))return['#3f6fa8','#e6f0ff','★★'];
  return['#6d756f','#f2f2ee','★'];
}
const rang=r=>{r=(r||'').toLowerCase();const i=ORDRE.findIndex(k=>r.includes(k));return i<0?ORDRE.length:i;};
function initiales(n){return(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(m=>m[0]).join('').toUpperCase();}

function dessinerListe(){
  const q=document.getElementById('recherche').value.trim().toLowerCase();
  const fs=toutes().map(f=>[f,vue(f)]).filter(([f])=>!q||(f.nom+' '+(f.surnom||'')).toLowerCase().includes(q))
    .sort((a,b)=>rang(a[1].rarete)-rang(b[1].rarete)||a[0].nom.localeCompare(b[0].nom,'fr'));
  let h='',o='';
  for(const [f,v] of fs){
    const [c]=couleur(v.rarete),tag=estModifiee(f.id)?(estNouvelle(f.id)?'nouvelle':'modifiée'):'';
    h+=`<button type="button" class="item" data-id="${esc(f.id)}" aria-current="${f.id===courant}"><span class="pastille" style="background:${c}"></span>${esc(f.nom)}${tag?`<span class="modif">${tag}</span>`:''}</button>`;
    o+=`<option value="${esc(f.id)}"${f.id===courant?' selected':''}>${esc(f.nom)}${tag?' ('+tag+')':''}</option>`;
  }
  document.getElementById('liste').innerHTML=h||'<p class="vide">Aucune fiche.</p>';
  document.getElementById('choixMobile').innerHTML=o;
  const n=Object.keys(modifs).length;
  document.getElementById('info').textContent=`${toutes().length} fiches · ${n?n+' modifiée'+(n>1?'s':'')+' dans ce navigateur':'aucune modification'}`;
}

function blocListe(titre,items,rendu){return items&&items.length?`<section class="bloc"><h4>${titre}</h4><div class="liste">${items.map(rendu).join('')}</div></section>`:'';}
function puces(titre,items){return items&&items.length?`<section class="bloc"><h4>${titre}</h4><div class="puces">${items.map(x=>`<span class="puce">${esc(x)}</span>`).join('')}</div></section>`:'';}

function barreApercu(f){
  if(!evolue(f))return'';const n=idxEtape(f);
  return `<div class="apercu"><span>Aperçu à la rareté :</span>${f.paliers.map((p,i)=>`<button type="button" data-etape="${i}" aria-pressed="${i===n}">${esc(p.rarete)}</button>`).join('')}${f.objet?`<label><input type="checkbox" id="objetObtenu"${objetObtenu[f.id]?' checked':''}> ${esc(f.objet.nom)} obtenu</label>`:''}</div>`;
}

function dessinerFiche(){
  const z=document.getElementById('zone');const f=fiche(courant);
  if(!f){z.innerHTML='<p class="vide">Choisis une fiche dans la liste.</p>';return;}
  if(edition){dessinerFormulaire(f);return;}
  const v=vue(f),[c,t,etoiles]=couleur(v.rarete);
  const portrait=f.image?`<img src="${esc(f.image)}" alt="Portrait de ${esc(f.nom)}">`:`<span class="initiales">${esc(initiales(f.nom))}</span><span class="sansimage">Portrait à venir</span>`;
  const actions=`<div class="actions"><button type="button" data-act="histoire" title="Histoire du personnage">📜</button><button type="button" data-act="modifier">Modifier</button>${estModifiee(f.id)?`<button type="button" data-act="annuler">${estNouvelle(f.id)?'Supprimer':'Revenir à l\'original'}</button>`:''}</div>`;
  const stats=STATS.map(k=>{const x=+((v.stats||{})[k])||0;return `<div class="stat"><b>${k==='Aura'?'AURA':k}</b><span>${x||'—'}</span><span class="barre"><i class="${x>1000?'exces':''}" style="width:${Math.min(100,x/10)}%"></i></span></div>`;}).join('');
  let h=barreApercu(f)+`<article class="fiche"><div class="bandeau" style="background:${c};color:${t}"><span class="etoiles">${etoiles}</span><span>${esc(v.rarete||'')}</span>${actions}</div>
    <div class="tete"><div class="portrait">${portrait}</div><div class="ident"><h2>${esc(f.nom)}</h2>${f.surnom?`<div class="surnom">« ${esc(f.surnom)} »</div>`:''}
    <dl><dt>Catégorie</dt><dd>${esc(f.categorie||'—')}</dd><dt>Profil</dt><dd>${esc(f.profil||'—')}</dd>${f.joueur?`<dt>Joueur</dt><dd>${esc(f.joueur)}</dd>`:''}</dl>
    <div class="stats">${stats}${f.statsNote?`<div class="statsnote">Stats ${esc(f.statsNote)}</div>`:''}</div></div></div>`;
  if(v.leader)h+=`<section class="bloc"><h4>👑 Aptitude de leader</h4><p>${esc(v.leader)}</p></section>`;
  h+=blocListe('✦ Aptitudes passives',v.passifs,p=>`<div class="ligne"><b>« ${esc(p.nom)} »</b> : ${esc(p.texte)}</div>`);
  h+=blocListe('⚔ Attaques spéciales',v.attaques,a=>`<div class="ligne"><span class="type">${esc(a.type)}</span><b>« ${esc(a.nom)} »</b><span class="quand">${esc(a.declenchement||'')}</span><br>${esc(a.texte)}</div>`);
  if(f.objet&&objetObtenu[f.id])h+=`<section class="bloc"><h4>🎒 Objet</h4><div class="ligne"><b>${esc(f.objet.nom)}</b><span class="quand">${esc(f.objet.obtention||'')}</span><br>${esc(f.objet.texte)}</div></section>`;
  h+=puces('🛡 Formations spéciales',v.formations)+puces('🎯 Stratégies spéciales',v.strategies)+puces('🔗 Liens',f.liens);
  if(f.note)h+=`<section class="bloc"><p class="note">${esc(f.note)}</p></section>`;
  z.innerHTML=h+'</article>';
  const cb=document.getElementById('objetObtenu');if(cb)cb.onchange=()=>{objetObtenu[f.id]=cb.checked;dessinerFiche();};
}

// ---------- modification ----------
function champ(lbl,name,val,type='text'){return type==='area'?`<label>${lbl}<textarea name="${name}">${esc(val)}</textarea></label>`:`<label>${lbl}<input name="${name}" type="${type}" value="${esc(val)}"></label>`;}
function rangeePassif(p={}){return `<div class="rangee" data-r="passif"><div class="entete"><input placeholder="Nom du passif" data-k="nom" value="${esc(p.nom)}"><button type="button" class="danger" data-act="retirer" title="Retirer">✕</button></div><textarea data-k="texte" placeholder="Effet">${esc(p.texte)}</textarea></div>`;}
function rangeeAttaque(a={}){return `<div class="rangee" data-r="attaque"><div class="entete"><select data-k="type">${['Effet','Coup de grâce','Attaque spéciale'].map(t=>`<option${a.type===t?' selected':''}>${t}</option>`).join('')}</select><input placeholder="Nom" data-k="nom" value="${esc(a.nom)}"><button type="button" class="danger" data-act="retirer" title="Retirer">✕</button></div><input data-k="declenchement" placeholder="Déclenchement (jauge d'Aura, condition…)" value="${esc(a.declenchement)}"><textarea data-k="texte" placeholder="Effet">${esc(a.texte)}</textarea></div>`;}

// partie « effets » du formulaire : la fiche entière, ou le palier en cours pour un personnage qui évolue
function blocEffets(src){
  return `<fieldset><legend>Stats</legend><div class="six">${STATS.map(k=>`<label>${k}<input name="stat_${k}" type="number" min="0" step="10" value="${esc((src.stats||{})[k]??'')}"></label>`).join('')}</div></fieldset>
    ${champ('👑 Aptitude de leader','leader',src.leader||'','area')}
    <fieldset><legend>✦ Aptitudes passives</legend><div id="passifs">${(src.passifs||[]).map(rangeePassif).join('')}</div><button type="button" data-act="ajouter" data-quoi="passif">+ Passif</button></fieldset>
    <fieldset><legend>⚔ Attaques spéciales</legend><div id="attaques">${(src.attaques||[]).map(rangeeAttaque).join('')}</div><button type="button" data-act="ajouter" data-quoi="attaque">+ Attaque</button></fieldset>
    ${champ('🛡 Formations spéciales (une par ligne)','formations',(src.formations||[]).join('\n'),'area')}
    ${champ('🎯 Stratégies spéciales (une par ligne)','strategies',(src.strategies||[]).join('\n'),'area')}`;
}

function dessinerFormulaire(f){
  const z=document.getElementById('zone');const ev=evolue(f),n=ev?idxEtape(f):0,src=ev?f.paliers[n]:f;
  let h=barreApercu(f)+`<article class="fiche"><form class="form" id="form" autocomplete="off">
    <div class="deux">${champ('Nom','nom',f.nom)}${champ('Surnom','surnom',f.surnom||'')}</div>
    <div class="deux">${ev?champ('Rareté de ce palier','rarete',src.rarete):champ('Rareté','rarete',f.rarete)}${champ('Catégorie','categorie',f.categorie||'')}</div>
    <div class="deux">${champ('Profil','profil',f.profil||'')}${champ('Joueur (personnage de départ)','joueur',f.joueur||'')}</div>
    ${champ('Portrait (adresse d\'une image, facultatif)','image',f.image||'')}
    ${ev?`<p class="vide">Tu modifies ce qui est gagné à la rareté « ${esc(src.rarete)} ». Choisis une autre rareté dans l'aperçu (en haut) pour modifier un autre palier.</p>`:champ('Précision sur les stats','statsNote',f.statsNote||'')}
    ${blocEffets(src)}
    ${champ('🔗 Liens (un par ligne)','liens',(f.liens||[]).join('\n'),'area')}
    ${f.objet||ev?`<fieldset><legend>🎒 Objet (apparaît une fois obtenu)</legend>${champ('Nom','objet_nom',(f.objet||{}).nom||'')}${champ('Obtention','objet_obtention',(f.objet||{}).obtention||'')}${champ('Effet','objet_texte',(f.objet||{}).texte||'','area')}</fieldset>`:''}
    ${champ('Note','note',f.note||'')}
    <div class="boutons"><button type="button" data-act="fermer">Annuler</button><button type="submit" class="or">Enregistrer</button></div></form></article>`;
  z.innerHTML=h;
  document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();enregistrer(f);});
}

function lireRangees(sel){return[...document.querySelectorAll(sel+' .rangee')].map(r=>{const o={};r.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());return o;}).filter(o=>o.nom||o.texte);}
const lignes=v=>v.split('\n').map(s=>s.trim()).filter(Boolean);

function enregistrer(ancienne){
  const fd=new FormData(document.getElementById('form'));const g=k=>(fd.get(k)||'').toString().trim();
  const f=copie(ancienne);if(!g('nom')){toast('Il faut au moins un nom');return;}
  for(const k of ['nom','surnom','categorie','profil','joueur','image','note'])f[k]=g(k);
  f.liens=lignes(g('liens'));
  const ev=evolue(f),dest=ev?f.paliers[idxEtape(f)]:f;
  if(ev)dest.rarete=g('rarete')||dest.rarete;else{f.rarete=g('rarete');f.statsNote=g('statsNote');}
  dest.stats={};for(const k of STATS){const v=g('stat_'+k);if(v!=='')dest.stats[k]=+v;}
  dest.leader=g('leader');dest.passifs=lireRangees('#passifs');dest.attaques=lireRangees('#attaques');
  dest.formations=lignes(g('formations'));dest.strategies=lignes(g('strategies'));
  if(g('objet_nom')||g('objet_texte'))f.objet={nom:g('objet_nom'),obtention:g('objet_obtention'),texte:g('objet_texte')};else delete f.objet;
  for(const k of Object.keys(f))if(f[k]===''&&k!=='histoire')delete f[k];
  modifs[f.id]=f;if(!ecrireModifs())return;
  edition=false;dessinerListe();dessinerFiche();toast('Fiche enregistrée dans ce navigateur');
}

function nouvelleFiche(){
  const id='perso-'+Date.now().toString(36);
  modifs[id]={id,nom:'Nouveau personnage',surnom:'',rarete:'Commun',categorie:'Général',profil:'',stats:{},leader:'',passifs:[],attaques:[],formations:[],strategies:[],liens:[],histoire:''};
  if(!ecrireModifs())return;courant=id;edition=true;dessinerListe();dessinerFiche();
}

function ouvrirHistoire(){
  const f=fiche(courant);if(!f)return;const d=document.getElementById('histoire');
  document.getElementById('histoireTitre').textContent='📜 '+f.nom;
  document.getElementById('histoireCorps').innerHTML=`<textarea id="histoireTexte" placeholder="L'histoire du personnage (pas encore écrite).">${esc(f.histoire||'')}</textarea><p style="margin:8px 0 0;display:flex;justify-content:flex-end"><button type="button" class="or" id="histoireEnregistrer">Enregistrer l'histoire</button></p>`;
  document.getElementById('histoireEnregistrer').onclick=()=>{const g=copie(f);g.histoire=document.getElementById('histoireTexte').value;modifs[g.id]=g;if(ecrireModifs()){dessinerListe();dessinerFiche();toast('Histoire enregistrée');d.close();}};
  if(d.showModal)d.showModal();else d.setAttribute('open','');
}

async function exporter(){
  const liste=Object.values(modifs);
  if(!liste.length){toast('Aucune modification à exporter');return;}
  const texte=JSON.stringify({type:'fiches-modifiees',date:new Date().toISOString().slice(0,10),fiches:liste},null,1);
  let ok=false;try{await navigator.clipboard.writeText(texte);ok=true;}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([texte],{type:'application/json'}));a.download='fiches-modifiees.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}
  toast(ok?'Copié ! Colle-le à Claude (ou envoie-lui le fichier téléchargé)':'Fichier téléchargé : envoie-le à Claude');
}

function choisir(id){courant=id;edition=false;dessinerListe();dessinerFiche();try{history.replaceState(null,'','#'+id);}catch(_){}document.getElementById('zone').scrollTop=0;}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.classList.contains('item')){choisir(b.dataset.id);return;}
  if(b.dataset.etape!==undefined){etape[courant]=+b.dataset.etape;dessinerListe();dessinerFiche();return;}
  const act=b.dataset.act;
  if(act==='modifier'){edition=true;dessinerFiche();}
  else if(act==='fermer'){edition=false;if(estNouvelle(courant)&&modifs[courant]&&modifs[courant].nom==='Nouveau personnage'){delete modifs[courant];ecrireModifs();courant=(toutes()[0]||{}).id;dessinerListe();}dessinerFiche();}
  else if(act==='annuler'){const nv=estNouvelle(courant);if(confirm(nv?'Supprimer cette nouvelle fiche ?':'Revenir à la version d\'origine et perdre tes modifications de cette fiche ?')){delete modifs[courant];ecrireModifs();if(nv)courant=(toutes()[0]||{}).id;dessinerListe();dessinerFiche();}}
  else if(act==='histoire')ouvrirHistoire();
  else if(act==='ajouter'){const q=b.dataset.quoi;document.querySelector(q==='passif'?'#passifs':'#attaques').insertAdjacentHTML('beforeend',q==='passif'?rangeePassif():rangeeAttaque());}
  else if(act==='retirer')b.closest('.rangee').remove();
});
document.getElementById('histoireFermer').onclick=()=>document.getElementById('histoire').close();
document.getElementById('recherche').addEventListener('input',dessinerListe);
document.getElementById('choixMobile').addEventListener('change',e=>choisir(e.target.value));
document.getElementById('nouvelle').onclick=nouvelleFiche;
document.getElementById('exporter').onclick=exporter;
document.getElementById('effacer').onclick=()=>{if(!Object.keys(modifs).length){toast('Aucune modification');return;}if(confirm('Effacer toutes tes modifications de ce navigateur ? (À faire une fois que Claude les a intégrées.)')){modifs={};ecrireModifs();courant=(toutes()[0]||{}).id;edition=false;dessinerListe();dessinerFiche();}};

(async function(){
  modifs=lireModifs();
  try{const r=await fetch('fiches.json',{cache:'no-cache'});const d=await r.json();base=d.fiches||[];}
  catch(e){document.getElementById('zone').innerHTML='<p class="vide">Impossible de charger les fiches.</p>';}
  const h=decodeURIComponent(location.hash.slice(1));
  dessinerListe();
  courant=fiche(h)?h:(document.querySelector('#liste .item')||{dataset:{}}).dataset.id;
  dessinerListe();dessinerFiche();
})();
</script>
</body>
</html>
