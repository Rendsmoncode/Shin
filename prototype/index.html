<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shin</title>
<style>
:root{--bg:#141a16;--line:#33443a;--fg:#e7e3d6;--muted:#a3ab9f;--gold:#e3b54a;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
main{display:grid;gap:12px;padding:16px;width:min(420px,100%);box-sizing:border-box}
h1{margin:0 0 8px;letter-spacing:.08em;text-transform:uppercase}
a{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:6px;color:var(--fg);text-decoration:none;font-size:20px;font-weight:600}
a:hover,a:focus-visible{border-color:var(--gold);outline:none}
a span{display:block;font-size:15px;font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Shin</h1>
  <a href="carte/">Carte d'Aubagne<span>La ville et ses quartiers (OpenStreetMap)</span></a>
  <a href="champ-3d/">Champ de bataille<span>Prototype de bataille rangée en 3D</span></a>
</main>
</body>
</html>
